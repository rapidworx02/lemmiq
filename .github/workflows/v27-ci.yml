name: LEMMIQ V2.7 CI

on:
  push:
    branches: [v2.7]
  pull_request:
    branches: [main]

jobs:
  source_bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build V2.7 patch bundle
        run: |
          mkdir -p dist
          python - <<'PY'
          import zipfile
          files = [
            "backend/app/models.py",
            "backend/app/main.py",
            "backend/app/chat_agent.py",
            "backend/app/v27.py",
            "backend/web/index.html",
            "backend/web/app.js",
            "backend/web/styles.css",
            "backend/web/sw.js",
            "android/app/build.gradle.kts",
            "android/app/src/main/java/com/lemmiq/app/Models.kt",
            "android/app/src/main/java/com/lemmiq/app/Api.kt",
            "android/app/src/main/java/com/lemmiq/app/LemmiqViewModel.kt",
            "android/app/src/main/java/com/lemmiq/app/LemmiqApp.kt",
            "android/app/src/main/java/com/lemmiq/app/V24Ui.kt",
            ".github/workflows/v27-ci.yml",
          ]
          readme = """LEMMIQ V2.7 PATCH

Copy/extract this ZIP directly over the root of your existing LEMMIQ repository.

V2.7 highlights:
- Simplified Q home
- Q Vision image analysis with searchable/reusable Vision memory
- Q Smart Memory: ~100 newest + up to 100 relevant older messages + rolling summaries
- Refined Q-to-Q for genuine coordination only, duplicate prevention and cancellation
- Android WhatsApp-style Status/Updates experience
- Automatic push status UX
- Browser Chats-home + stale service-worker cache fixes
- AUTO-mode one-reply-per-human-trigger protection

Q Vision requires the existing ANTHROPIC_API_KEY and media storage configuration on the backend.
New database tables are created automatically by the existing Base.metadata.create_all startup.

After extracting:
git status
git diff --stat
git add .
git commit -m "LEMMIQ V2.7 - Q Vision, smart memory and UX upgrades"
git push origin main
"""
          changed = "\n".join(files) + "\n"
          with zipfile.ZipFile("dist/LEMMIQ_V2.7_PATCH.zip","w",zipfile.ZIP_DEFLATED) as z:
              for path in files:
                  z.write(path,path)
              z.writestr("V2.7_README.txt",readme)
              z.writestr("V2.7_CHANGED_FILES.txt",changed)
          PY

      - name: Upload V2.7 patch
        uses: actions/upload-artifact@v4
        with:
          name: LEMMIQ-V2.7-PATCH
          path: dist/LEMMIQ_V2.7_PATCH.zip
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q backend/app

      - name: Validate web JavaScript
        run: node --check backend/web/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEMMIQ-V2.7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
