name: LEMMIQ V2.7 CI

on:
  push:
    branches: [v2.7]
  pull_request:
    branches: [main]

jobs:
  source_bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V2.7 patch bundle
        run: |
          mkdir -p dist
          python - <<'PY'
          import zipfile
          files = [
            "backend/app/models.py",
            "backend/app/main.py",
            "backend/app/chat_agent.py",
            "backend/app/v27.py",
            "backend/web/index.html",
            "backend/web/app.js",
            "backend/web/styles.css",
            "backend/web/sw.js",
            "android/app/build.gradle.kts",
            "android/app/src/main/java/com/lemmiq/app/Models.kt",
            "android/app/src/main/java/com/lemmiq/app/Api.kt",
            "android/app/src/main/java/com/lemmiq/app/LemmiqViewModel.kt",
            "android/app/src/main/java/com/lemmiq/app/LemmiqApp.kt",
            "android/app/src/main/java/com/lemmiq/app/LemmiqCallActivity.kt",
            "android/app/src/main/java/com/lemmiq/app/V24Ui.kt",
            ".github/workflows/v27-ci.yml",
          ]
          notes = [
            "LEMMIQ V2.7 PATCH",
            "",
            "Extract this ZIP directly over the root of your existing LEMMIQ repository.",
            "",
            "Highlights: simplified Q home; Q Vision + reusable Vision memory; Q Smart Memory;",
            "refined Q-to-Q; story-style Android Updates; automatic push UX; web cache/Chats fix;",
            "and AUTO one-reply-per-human-trigger protection.",
            "",
            "Q Vision requires the existing ANTHROPIC_API_KEY and media storage configuration.",
            "New database tables are created automatically by Base.metadata.create_all.",
            "",
            "Then run:",
            "git status",
            "git diff --stat",
            "git add .",
            "git commit -m \"LEMMIQ V2.7 - Q Vision, smart memory and UX upgrades\"",
            "git push origin main",
          ]
          readme = "\n".join(notes) + "\n"
          changed = "\n".join(files) + "\n"
          with zipfile.ZipFile("dist/LEMMIQ_V2.7_PATCH.zip","w",zipfile.ZIP_DEFLATED) as z:
              for path in files:
                  z.write(path,path)
              z.writestr("V2.7_README.txt",readme)
              z.writestr("V2.7_CHANGED_FILES.txt",changed)
          PY
      - name: Upload V2.7 patch
        uses: actions/upload-artifact@v4
        with:
          name: LEMMIQ-V2.7-PATCH
          path: dist/LEMMIQ_V2.7_PATCH.zip
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q backend/app
      - name: Validate web JavaScript
        run: node --check backend/web/app.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEMMIQ-V2.7-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
