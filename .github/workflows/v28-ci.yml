name: LEMMIQ V28 CI

on:
  push:
    branches: [ "v2.8" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall backend/app
      - name: Web JavaScript syntax
        run: |
          node --check backend/web/app.js
          node --check backend/web/v28.js
          node --check backend/web/sw.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Android debug compile
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
