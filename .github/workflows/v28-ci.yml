name: LEMMIQ V28 CI

on:
  push:
    branches: [ "v2.8" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m compileall backend/app
      - name: Web JavaScript syntax
        run: |
          node --check backend/web/app.js
          node --check backend/web/v28.js
          node --check backend/web/sw.js
      - name: Backend Q economy smoke test
        env:
          DATABASE_URL: sqlite:////tmp/lemmiq-v28-ci.db
          LEMMIQ_JWT_SECRET: ci-only-secret-not-for-production
          LEMMIQ_LOCAL_MEDIA: "true"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx
          cd backend
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as c:
              assert c.get("/health").json()["version"] == "2.8.2"

              a = c.post("/register", json={"username":"v28alpha","display_name":"Alpha","password":"password123"}).json()
              b = c.post("/register", json={"username":"v28beta","display_name":"Beta","password":"password123"}).json()
              ha = {"Authorization": "Bearer " + a["token"]}
              hb = {"Authorization": "Bearer " + b["token"]}

              wa = c.get("/v28/wallet", headers=ha)
              assert wa.status_code == 200, wa.text
              assert abs(wa.json()["balance_q"] - 100.0) < 0.001
              assert wa.json()["cashout_enabled"] is False

              referral_code = wa.json()["referral_code"]
              g = c.post("/register", json={
                  "username":"v28gamma","display_name":"Gamma","password":"password123",
                  "referral_code":referral_code
              })
              assert g.status_code == 200, g.text
              hg = {"Authorization": "Bearer " + g.json()["token"]}
              wg = c.get("/v28/wallet", headers=hg)
              assert wg.status_code == 200, wg.text
              assert abs(wg.json()["balance_q"] - 125.0) < 0.001
              wa_after_referral = c.get("/v28/wallet", headers=ha)
              assert wa_after_referral.json()["balance_q"] >= 125.0

              # Promote Alpha as CI Master Admin, configure a package wallet, then
              # verify that an approved package purchase pays the original referrer.
              from app.database import SessionLocal
              from app.v28 import QAdminRole
              db = SessionLocal()
              try:
                  db.add(QAdminRole(user_id=a["user"]["id"], role="MASTER_ADMIN", active=True))
                  db.commit()
              finally:
                  db.close()
              wallet_cfg = c.post("/v28/admin/payment-wallets", headers=ha, json={
                  "network":"BEP20","package_code":"STARTER_10","label":"CI",
                  "address":"0x1111111111111111111111111111111111111111","active":True
              })
              assert wallet_cfg.status_code == 200, wallet_cfg.text
              po = c.post("/v28/payments/orders", headers=hg, json={"package_code":"STARTER_10","network":"BEP20"})
              assert po.status_code == 200, po.text
              pid = po.json()["id"]
              submitted = c.post(f"/v28/payments/orders/{pid}/submit", headers=hg, json={
                  "tx_hash":"0x" + "a"*64, "note":"CI referral package reward"
              })
              assert submitted.status_code == 200, submitted.text
              approved = c.post(f"/v28/admin/payment-orders/{pid}/approve", headers=ha, json={})
              assert approved.status_code == 200, approved.text
              refs = c.get("/v28/referrals", headers=ha)
              assert refs.status_code == 200, refs.text
              assert refs.json()["paid_users"] >= 1
              assert any(x["current_tier"] == "Q Starter" for x in refs.json()["items"])
              assert any(e["type"] == "PACKAGE_PURCHASE" for x in refs.json()["items"] for e in x["events"])
              q_referral_package_reward = True
              assert q_referral_package_reward

              claim = c.post("/v28/wallet/claim-daily", headers=ha, json={})
              assert claim.status_code == 200, claim.text
              assert claim.json()["balance_q"] >= 102.0

              tx = c.post("/v28/wallet/transfer", headers=ha, json={"username":"v28beta","amount_q":1,"note":"CI"})
              assert tx.status_code == 200, tx.text

              listing = c.post("/v28/market/listings", headers=ha, json={
                  "title":"CI service","description":"test","category":"SERVICE",
                  "condition":"SERVICE","price_q":10,"inventory":1
              })
              assert listing.status_code == 200, listing.text
              lid = listing.json()["id"]
              media = c.post(
                  f"/v28/market/listings/{lid}/media", headers=ha,
                  files={"file": ("ci-photo.jpg", b"\xff\xd8\xffCIJPEG", "image/jpeg")}
              )
              assert media.status_code == 200, media.text
              refreshed_listing = c.get("/v28/market/my-listings", headers=ha)
              assert refreshed_listing.status_code == 200
              assert len(refreshed_listing.json()[0]["media"]) == 1

              buy = c.post(f"/v28/market/listings/{lid}/buy", headers=hb, json={"quantity":1})
              assert buy.status_code == 200, buy.text
              oid = buy.json()["id"]

              assert c.post(f"/v28/market/orders/{oid}/accept", headers=ha, json={}).status_code == 200
              assert c.post(f"/v28/market/orders/{oid}/delivered", headers=ha, json={}).status_code == 200
              done = c.post(f"/v28/market/orders/{oid}/complete", headers=hb, json={})
              assert done.status_code == 200, done.text
              assert done.json()["status"] == "COMPLETED"
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Android debug compile
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
