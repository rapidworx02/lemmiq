name: LEMMIQ V271 CI

on:
  push:
    branches:
      - v2.7.1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q backend/app
      - name: Validate web JavaScript
        run: node --check backend/web/app.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
