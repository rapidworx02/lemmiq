name: LEMMIQ V2.7.1 Play Bundle

on:
  workflow_dispatch:

jobs:
  build_signed_aab:
    runs-on: ubuntu-latest
    env:
      LEMMIQ_API_BASE_URL: ${{ vars.LEMMIQ_API_BASE_URL || 'https://lemmiq-api.onrender.com' }}
      LEMMIQ_UPLOAD_STORE_FILE: upload-keystore.jks
      LEMMIQ_UPLOAD_STORE_PASSWORD: ${{ secrets.LEMMIQ_UPLOAD_STORE_PASSWORD }}
      LEMMIQ_UPLOAD_KEY_ALIAS: ${{ secrets.LEMMIQ_UPLOAD_KEY_ALIAS }}
      LEMMIQ_UPLOAD_KEY_PASSWORD: ${{ secrets.LEMMIQ_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore Play upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.LEMMIQ_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing secret LEMMIQ_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$LEMMIQ_UPLOAD_STORE_PASSWORD" || (echo "Missing secret LEMMIQ_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$LEMMIQ_UPLOAD_KEY_ALIAS" || (echo "Missing secret LEMMIQ_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$LEMMIQ_UPLOAD_KEY_PASSWORD" || (echo "Missing secret LEMMIQ_UPLOAD_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks

      - name: Restore Firebase google-services.json
        env:
          FIREBASE_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_B64" || (echo "Missing secret GOOGLE_SERVICES_JSON_BASE64" && exit 1)
          echo "$FIREBASE_B64" | base64 --decode > android/app/google-services.json

      - name: Validate release configuration
        run: |
          test -f android/upload-keystore.jks
          test -f android/app/google-services.json
          keytool -list -keystore android/upload-keystore.jks -storepass "$LEMMIQ_UPLOAD_STORE_PASSWORD" -alias "$LEMMIQ_UPLOAD_KEY_ALIAS" >/dev/null

      - name: Build signed release AAB
        run: gradle -p android clean :app:bundleRelease --stacktrace

      - name: Verify AAB signature
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: LEMMIQ-V2.7.1-PLAY-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
